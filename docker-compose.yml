services:
  mysql:
    image: mysql:8.0
    container_name: mysql-allahpan
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: allahpan
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: redis-allahpan
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    image: allahpan-elasticsearch:8.11.0-ik
    container_name: elasticsearch-allahpan
    # ports:  # 9200 被 Windows 保留端口占用，注释掉宿主机映射，容器间仍可通信
      # - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: docker/core/Dockerfile
    container_name: allahpan-core
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/allahpan?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      ALLAHPAN_CHUNK_TEMP_DIR: /tmp/allahpan-chunks
      ALLAHPAN_SEARCH_SERVICE_URL: http://search:8081/es-admin/files
      # Ollama 运行在宿主机，容器通过 host.docker.internal 访问
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: docker/search/Dockerfile
    container_name: allahpan-search
    ports:
      - "8081:8081"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: allahpan-nginx
    ports:
      - "88:88"
      - "20241:20241"
    depends_on:
      - core
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: allahpan-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    network_mode: "service:nginx"
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  es-data:
  minio-data:
