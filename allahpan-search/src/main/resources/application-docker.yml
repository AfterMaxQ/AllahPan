# Docker 环境配置 — application-docker.yml 自动绑定 docker profile
server:
  address: 0.0.0.0

spring:
  elasticsearch:
    uris: http://elasticsearch:9200
  data:
    redis:
      host: redis

allahpan:
  logging:
    service-name: allahpan-search
    slow-request-ms: ${ALLAHPAN_SLOW_REQUEST_MS:1000}

logging:
  file:
    path: ${LOG_PATH:/app/logs}
